[env:album_nfc]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = espidf

; ---- Flash ----
board_build.flash_mode  = qio
board_build.flash_freq  = 80m
board_upload.flash_size = 16MB
board_build.partitions  = partitions.csv

; ---- CPU ----
board_build.f_cpu = 240000000L

; Dropped to the most conservative standard rate (9600) to fully isolate
; signal integrity: with caffeinate preventing sleep/throttling, the upload
; has gotten further each attempt (60% -> 80% -> 94%) rather than failing at
; one fixed point, pointing at a marginal signal/power path, not a timeout.
upload_speed  = 9600
monitor_speed = 115200
